version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Denver
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Denver
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: America/Denver
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:25"
      timezone: America/Denver
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Denver
    labels:
      - dependencies
      - github-actions
