name: Repair Core 01.06.01

on:
  push:
    branches: [release-01.06.01-fixes]
    paths:
      - .github/workflows/repair-core-010601.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/release-01.06.01-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Apply narrow source repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('server/internal/config/config.go')
          text = config.read_text()
          text = text.replace('Version = "01.06.00"', 'Version = "01.06.01"', 1)
          config.write_text(text)

          main = Path('server/cmd/api/main.go')
          text = main.read_text()
          needle = '''\tif err := schema.Ensure(ctx, pool); err != nil {\n\t\tlog.Fatalf("schema ensure failed: %v", err)\n\t}\n'''
          replacement = '''\tif err := schema.PrepareSeasonSchema(ctx, pool); err != nil {\n\t\tlog.Fatalf("schema preflight failed: %v", err)\n\t}\n\tif err := schema.Ensure(ctx, pool); err != nil {\n\t\tlog.Fatalf("schema ensure failed: %v", err)\n\t}\n'''
          if needle not in text:
              raise SystemExit('main.go schema anchor not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              '\t\tReadHeaderTimeout: 10 * time.Second,\n',
              '\t\tReadHeaderTimeout: 10 * time.Second,\n\t\tReadTimeout: 30 * time.Second,\n\t\tWriteTimeout: 30 * time.Second,\n\t\tIdleTimeout: 60 * time.Second,\n',
              1,
          )
          main.write_text(text)
          PY
          gofmt -w server/cmd/api/main.go server/internal/config/config.go server/internal/schema/preflight.go server/internal/auth/auth.go server/internal/auth/auth_test.go

      - name: Run Go tests
        working-directory: server
        run: go test -count=1 ./...

      - name: Commit validated repairs
        shell: bash
        run: |
          git rm -f -- .github/workflows/repair-core-010601.yml scripts/release_010601.part-00
          git add -- server/cmd/api/main.go server/internal/config/config.go server/internal/schema/preflight.go server/internal/auth/auth.go server/internal/auth/auth_test.go VERSION docs/RELEASE_NOTES_01.06.01.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'v01.06.01 core repairs' -m 'Fix fresh-database startup ordering, align runtime version metadata, harden authentication primitives, and add complete HTTP server timeouts.'
          git push origin HEAD:release-01.06.01-fixes
