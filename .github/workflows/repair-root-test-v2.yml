name: Repair Root Image Test V2

on:
  push:
    branches:
      - release-01.06.01-fixes
    paths:
      - .github/workflows/repair-root-test-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Update assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/internal/build/root_dockerfile_test.go')
          text = path.read_text()
          replacements = {
              'FROM golang:1.22-alpine AS build': 'FROM golang:1.26.5-alpine3.22 AS build',
              'FROM alpine:3.20': 'FROM alpine:3.22',
              'COPY web/static/ /app/web/': 'COPY --chown=10001:10001 web/static/ /app/web/',
              'ENV HTTP_ADDR=:8080': 'HTTP_ADDR=:8080',
              'ENV WEB_ROOT=/app/web': 'WEB_ROOT=/app/web',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing assertion: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate and commit
        shell: bash
        run: |
          cd server
          gofmt -w internal/build/root_dockerfile_test.go
          go test -count=1 ./internal/build
          cd ..
          git add -- server/internal/build/root_dockerfile_test.go
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(container): align root image assertions'
          git push origin HEAD:release-01.06.01-fixes
