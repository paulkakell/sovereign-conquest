name: Finalize Release 01.06.04

on:
  workflow_run:
    workflows: [CI, Build Validation, Publish GHCR Image]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: finalize-release-01.06.04
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Test release safeguards
        run: node --test scripts/finalize-release.test.cjs

      - name: Finalize validated release and remove incorporated branches
        uses: actions/github-script@v9
        with:
          script: |
            const finalize = require('./scripts/finalize-release.cjs');
            await finalize({ github, context, core });
