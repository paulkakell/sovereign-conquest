name: Correct Changelog Base Version

on:
  push:
    branches:
      - release-01.06.01-fixes
    paths:
      - .github/workflows/fix-changelog-base-010601.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Correct release entry
        shell: bash
        run: |
          sed -i '0,/Go 1.26.5 and Alpine 3.22/s//Go 1.26.5 and Alpine 3.24/' CHANGELOG.md
          grep -F 'Go 1.26.5 and Alpine 3.24' CHANGELOG.md

      - name: Commit correction
        shell: bash
        run: |
          git rm -f -- .github/workflows/fix-changelog-base-010601.yml
          git add -- CHANGELOG.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: correct 01.06.01 container base version'
          git push origin HEAD:release-01.06.01-fixes
