name: Upgrade Dependencies 01.06.02

on:
  push:
    branches:
      - release-01.06.01-fixes
    paths:
      - .github/workflows/upgrade-dependencies-010602.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: server/go.sum

      - name: Refresh module graph
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          go get github.com/go-chi/chi/v5@latest
          go get github.com/golang-jwt/jwt/v5@latest
          go get github.com/jackc/pgx/v5@latest
          go get golang.org/x/crypto@latest
          go mod tidy
          go mod vendor
          go mod verify

      - name: Run source validation
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...

      - name: Run Go vulnerability analysis
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Commit validated dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/upgrade-dependencies-010602.yml
          git add -- server/go.mod server/go.sum server/vendor
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): refresh Go dependencies for 01.06.02'
          git push origin HEAD:release-01.06.01-fixes
