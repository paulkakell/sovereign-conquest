name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release-*'
      - 'compose-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sc_test
          POSTGRES_PASSWORD: Integration-Fixture-Only-2026
          POSTGRES_DB: sc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sc_test -d sc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SC_TEST_DATABASE_URL: postgres://sc_test:Integration-Fixture-Only-2026@localhost:5432/sc_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: server/go.sum

      - name: Verify JavaScript syntax
        run: |
          node --check web/static/admin-users.js
          node --check web/static/app.js
          node --check web/static/compat-010601.js
          node --check web/static/bug.js

      - name: Test release finalization safeguards
        run: node --test scripts/*.test.cjs

      - name: Test database recovery failure handling
        run: python3 -m unittest discover -s scripts -p 'test_db_recovery.py' -v

      - name: Verify Go formatting
        working-directory: server
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Verify module graph
        working-directory: server
        run: go mod verify

      - name: Run unit and regression tests
        working-directory: server
        run: go test -count=1 ./...

      - name: Run race tests
        working-directory: server
        run: go test -race -count=1 ./...

      - name: Measure parallel authenticated-session lookup
        working-directory: server
        run: go test ./internal/api -run '^$' -bench BenchmarkAuthenticatedSession -benchtime=1s -count=1

      - name: Run Go vet
        working-directory: server
        run: go vet ./...

      - name: Run Go security static analysis
        working-directory: server
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...

      - name: Run reachable-code vulnerability analysis
        working-directory: server
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Validate Compose settings and environment contract
        run: python3 -m unittest discover -s scripts -p 'test_compose_config.py' -v
