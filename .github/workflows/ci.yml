name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release-01.06.01-fixes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify JavaScript syntax
        run: |
          node --check web/static/app.js
          node --check web/static/compat-010601.js
          node --check web/static/bug.js

      - name: Verify Go formatting
        working-directory: server
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Run unit and regression tests
        working-directory: server
        run: go test -count=1 ./...

      - name: Run race tests
        working-directory: server
        run: go test -race -count=1 ./...

      - name: Run Go vet
        working-directory: server
        run: go vet ./...

      - name: Validate Compose configuration
        run: docker compose config --quiet
