name: Changelog 01.06.01

on:
  push:
    branches: [release-01.06.01-fixes]
    paths: [.github/workflows/changelog-010601.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Prepend release entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          current = path.read_text()
          marker = '# Changelog\n'
          if not current.startswith(marker):
              raise SystemExit('CHANGELOG.md header not found')
          entry = '''

## 01.06.01 (2026-08-13)

Fix
- Fresh database startup now establishes the season dependency before creating player season indexes.
- Browser compatibility now corrects planet transfers, citadel upgrades, corporation banking, market filters, event fields, activity fields, protected attachment downloads, and the required administrator password-change flow.
- The duplicate Docker publishing workflow containing unresolved merge markers was removed.
- API and all-in-one containers now run as a non-root user and expose liveness health checks.

Security
- Authentication now uses bcrypt cost 12 and stricter JWT algorithm, issued-at, and expiration validation.
- HTTP transport now applies request-size limits, endpoint-class rate limits, forwarding-header sanitization, structured request logging, browser security headers, liveness, and database readiness probes.
- The season reset endpoint now requires both a signed administrator identity and the separately configured administration key.
- Production startup rejects short signing material, short bootstrap administrator values, and database connections without transport verification.
- Dependabot monitoring covers Go modules, Dockerfiles, and GitHub Actions.

Reliability and performance
- Port and planet jobs now use transaction-scoped PostgreSQL advisory locks so only one replica performs each scheduled update.
- Event generation uses a session-level leader lock across replicas.
- HTTP read, write, header, and idle timeouts are defined.
- A limiter benchmark and browser contract regression tests were added.

Maintenance
- Version metadata is aligned at 01.06.01.
- Root and API Docker build stages use Go 1.26.5 and Alpine 3.22.
- CI runs JavaScript syntax checks, formatting verification, unit and regression tests, race detection, Go vet, and Compose validation.
- Release notes and operational documentation were added under docs/.

Breaking behavior
- Production deployments using weak defaults or database connections without transport verification no longer start.
- The destructive season reset endpoint now requires an authenticated administrator session in addition to the administration key.

Known limitation
- The repository connector rejected automated regeneration of go.sum and server/vendor. Dependency versions remain unchanged in this branch and must not be represented as upgraded until a trusted local checkout regenerates and validates the module graph.

Refs
- SC-DB-004, SC-WEB-005, SC-AUTH-004, SC-SEC-004, SC-RUNTIME-003, SC-CI-011
- Audit base: 7cec9eaf47e835e6555fdd3f8284c7b73b0c20c3
'''
          if '## 01.06.01 ' not in current:
              path.write_text(marker + entry + current[len(marker):])
          PY

      - name: Commit changelog
        run: |
          git add -- CHANGELOG.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update changelog for 01.06.01'
          git push origin HEAD:release-01.06.01-fixes
