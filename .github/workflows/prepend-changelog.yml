name: Prepend Changelog Entry

on:
  push:
    branches:
      - release-01.06.01-fixes
    paths:
      - .github/workflows/prepend-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Update changelog
        shell: bash
        run: |
          if grep -q '^## 01.06.01 ' CHANGELOG.md; then
            exit 0
          fi
          {
            head -n 1 CHANGELOG.md
            printf '\n'
            cat docs/CHANGELOG_ENTRY_01.06.01.md
            printf '\n'
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Commit changelog
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git add -- CHANGELOG.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update changelog for 01.06.01'
          git push origin HEAD:release-01.06.01-fixes
