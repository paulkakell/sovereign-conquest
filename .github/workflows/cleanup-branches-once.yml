name: One-time Branch Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-disposed-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const failures = [];
            for (const branch of branches) {
              if (branch.name === "main") continue;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`,
                });
                core.info(`Deleted branch: ${branch.name}`);
              } catch (error) {
                failures.push(`${branch.name}: ${error.message}`);
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Branch cleanup incomplete:\n${failures.join("\n")}`);
            }
