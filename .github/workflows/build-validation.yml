name: Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'release-*'
      - 'compose-*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test container security policy and smoke-test syntax
        run: |
          bash -n scripts/release-smoke.sh
          python3 -m unittest discover -s scripts -p 'test_container_security.py' -v

      - name: Validate Compose settings and environment contract
        run: python3 -m unittest discover -s scripts -p 'test_compose_config.py' -v

      - name: Build combined image
        run: docker build --pull --tag sovereign-conquest:validation .

      - name: Build API image
        run: docker build --pull --tag sovereign-conquest-api:validation ./server

      - name: Build web image
        run: docker build --pull --tag sovereign-conquest-web:validation ./web

      - name: Verify both API runtime inventories
        run: |
          mkdir -p container-security
          python3 scripts/container-security-check.py inventory sovereign-conquest:validation > container-security/combined-inventory.json
          python3 scripts/container-security-check.py inventory sovereign-conquest-api:validation > container-security/api-inventory.json

      - name: Scan combined image before integration
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: sovereign-conquest:validation
          scanners: vuln
          format: json
          output: container-security/combined-trivy.json
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Scan standalone API image before integration
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IGNOREFILE: /dev/null
        with:
          image-ref: sovereign-conquest-api:validation
          scanners: vuln
          format: json
          output: container-security/api-trivy.json
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Export SBOMs and enforce container vulnerability policy
        run: |
          trivy convert --format cyclonedx --output container-security/combined-sbom.cdx.json container-security/combined-trivy.json
          trivy convert --format cyclonedx --output container-security/api-sbom.cdx.json container-security/api-trivy.json
          python3 scripts/container-security-check.py vulnerabilities container-security/combined-trivy.json
          python3 scripts/container-security-check.py vulnerabilities container-security/api-trivy.json

      - name: Run fresh-database integration tests for both API images
        shell: bash
        env:
          SC_IMAGE: sovereign-conquest:validation
          SC_EXPECTED_VERSION: '01.07.00'
          SC_HOST_PORT: '18082'
          SC_NAME_PREFIX: validation
          SC_DB_PASSWORD: BuildValidationDatabasePassword
          SC_JWT_SECRET: Build-Validation-JWT-Secret-For-Fresh-Database-Testing
          SC_ADMIN_SECRET: Build-Validation-Administrator-Secret-For-Testing
          SC_INITIAL_ADMIN_PASSWORD: Build-Validation-Admin-Password-2026!
        run: |
          bash scripts/release-smoke.sh
          SC_IMAGE=sovereign-conquest-api:validation SC_EXPECT_WEB=false SC_HOST_PORT=18084 SC_NAME_PREFIX=validationapi bash scripts/release-smoke.sh

      - name: Retain container security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-container-security-${{ github.sha }}
          path: container-security/
          if-no-files-found: warn
          retention-days: 30

  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record existing code scanning alerts
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            for (const alert of alerts) {
              core.info(JSON.stringify({
                number: alert.number, rule: alert.rule.id,
                severity: alert.rule.security_severity_level,
                description: alert.rule.description,
                location: alert.most_recent_instance.location,
                ref: alert.most_recent_instance.ref,
                url: alert.html_url,
              }));
            }
            core.info(`Open code scanning alerts: ${alerts.length}`);

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: server/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build
        working-directory: server
        run: go build ./...

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results

      - name: Reject high and critical CodeQL findings
        run: node scripts/check-codeql-results.cjs codeql-results/*.sarif

      - name: Verify default-branch alert resolution
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
              ...context.repo, state: 'open', ref: 'refs/heads/main', per_page: 100,
            });
            const high = alerts.filter(alert => ['high', 'critical'].includes(alert.rule.security_severity_level));
            core.info(`Open high/critical code scanning alerts on main: ${high.length}`);
            for (const alert_number of [2, 3, 4, 5]) {
              const { data } = await github.rest.codeScanning.getAlert({ ...context.repo, alert_number });
              core.info(JSON.stringify({ number: data.number, state: data.state, fixed_at: data.fixed_at }));
            }
            if (high.length) core.setFailed('High or critical code scanning alerts remain on main');

      - name: Retain CodeQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ github.sha }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 30
