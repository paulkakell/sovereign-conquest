name: Build Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - release-01.06.01-fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build combined image
        run: docker build --pull --tag sovereign-conquest:validation .

      - name: Build API image
        run: docker build --pull --tag sovereign-conquest-api:validation ./server

      - name: Build web image
        run: docker build --pull --tag sovereign-conquest-web:validation ./web
