name: Repair Web 01.06.01

on:
  push:
    branches: [release-01.06.01-fixes]
    paths:
      - .github/workflows/repair-web-010601.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/release-01.06.01-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Repair browser contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          def read(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {text.count(old)}')
              return text.replace(old, new, 1)

          app_path = 'web/static/app.js'
          app = read(app_path)

          app = replace_once(
              app,
              '  let token = localStorage.getItem("token") || "";',
              dedent('''
                const TOKEN_KEY = "sovereign_token";
                const LEGACY_TOKEN_KEY = "token";
                let token = localStorage.getItem(TOKEN_KEY) || localStorage.getItem(LEGACY_TOKEN_KEY) || "";
                if (token && !localStorage.getItem(TOKEN_KEY)) {
                  localStorage.setItem(TOKEN_KEY, token);
                  localStorage.removeItem(LEGACY_TOKEN_KEY);
                }
              ''').strip('\n'),
              'token migration',
          )
          app = replace_once(app, '    localStorage.setItem("token", token);', '    localStorage.setItem(TOKEN_KEY, token);', 'token store')
          app = replace_once(
              app,
              '    localStorage.removeItem("token");',
              '    localStorage.removeItem(TOKEN_KEY);\n    localStorage.removeItem(LEGACY_TOKEN_KEY);',
              'token removal',
          )

          pattern = re.compile(r'  function renderEvent\(e\) \{.*?\n  \}\n\n  function appendLogs', re.S)
          replacement = dedent('''
            function renderEvent(e) {
              if (!e) {
                eventDetails.textContent = "No active event.";
                return;
              }
              const lines = [];
              lines.push(`Event: ${e.title || e.kind || "Active event"}`);
              if (e.description) lines.push(e.description);
              if (e.commodity) lines.push(`Commodity: ${e.commodity}`);
              if (e.price_percent) lines.push(`Price effect: ${e.price_percent}%`);
              lines.push(`Ends: ${fmtTime(e.ends_at)}`);
              eventDetails.textContent = lines.join("\\n");
            }

            function appendLogs''').rstrip()
          app, count = pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit('event renderer anchor not found')

          app = replace_once(app, '    for (const l of logs) {', '    for (const l of logs.slice().reverse()) {', 'log order')
          app = replace_once(app, '      div.textContent = `[${l.kind}] ${l.msg}`;', '      div.textContent = `[${l.kind}] ${l.message || ""}`;', 'log field')

          old_planet = '''    if (type === "PLANET") {
              const action = (parts[1] || "INFO").toUpperCase();
              const name = parts.slice(2).join(" ");
              return { type: "PLANET", action, name };
            }
          '''
          new_planet = '''    if (type === "PLANET") {
              const action = (parts[1] || "INFO").toUpperCase();
              if (action === "INFO") return { type: "PLANET", action };
              if (action === "COLONIZE") return { type: "PLANET", action, name: parts.slice(2).join(" ") };
              if (action === "LOAD" || action === "UNLOAD") {
                const commodity = (parts[2] || "").toUpperCase();
                const quantity = Number(parts[3]);
                if (!["ORE", "ORGANICS", "EQUIPMENT"].includes(commodity) || !Number.isInteger(quantity) || quantity < 1) return null;
                return { type: "PLANET", action, commodity, quantity };
              }
              if (action === "UPGRADE" && (parts[2] || "").toUpperCase() === "CITADEL") {
                return { type: "PLANET", action: "UPGRADE_CITADEL" };
              }
              return null;
            }
          '''
          app = replace_once(app, old_planet, new_planet, 'planet parser')

          old_corp = '''    if (type === "CORP") {
              const action = (parts[1] || "INFO").toUpperCase();
              const name = parts.slice(2).join(" ");
              return { type: "CORP", action, name, text: parts.slice(2).join(" ") };
            }
          '''
          new_corp = '''    if (type === "CORP") {
              const action = (parts[1] || "INFO").toUpperCase();
              if (action === "INFO" || action === "LEAVE") return { type: "CORP", action };
              if (action === "CREATE" || action === "JOIN") return { type: "CORP", action, name: parts.slice(2).join(" ") };
              if (action === "SAY") return { type: "CORP", action, text: parts.slice(2).join(" ") };
              if (action === "DEPOSIT" || action === "WITHDRAW") {
                const quantity = Number(parts[2]);
                if (!Number.isInteger(quantity) || quantity < 1) return null;
                return { type: "CORP", action, quantity };
              }
              return null;
            }
          '''
          app = replace_once(app, old_corp, new_corp, 'corporation parser')

          app = replace_once(
              app,
              '    if (type === "MARKET") return { type: "MARKET" };\n    if (type === "ROUTE") return { type: "ROUTE" };',
              '''    if (type === "MARKET" || type === "ROUTE") {
              const commodity = (parts[1] || "").toUpperCase();
              if (commodity && !["ORE", "ORGANICS", "EQUIPMENT"].includes(commodity)) return null;
              return commodity ? { type, commodity } : { type };
            }''',
              'market and route parser',
          )

          app = replace_once(
              app,
              '''      if (Array.isArray(resp?.logs)) {
                appendLogs(resp.logs);
              }
          ''',
              '''      if (Array.isArray(resp?.logs)) {
                logBox.innerHTML = "";
                appendLogs(resp.logs);
              }
          ''',
              'command log refresh',
          )

          app = replace_once(
              app,
              '''  function showAuthUI() {
              show(game, false);
              show(topbar, false);
              show(auth, true);
            }
          ''',
              '''  function showAuthUI() {
              show(game, false);
              show(topbar, false);
              show(auth, true);
            }

            function showPasswordChangeUI() {
              stopUnreadPolling();
              show(game, false);
              show(topbar, false);
              show(auth, true);
              show(loginPanel, false);
              show(registerPanel, false);
              show(pwChangePanel, true);
              authMsg.textContent = "Password change required before gameplay.";
            }
          ''',
              'password change display',
          )

          enter_pattern = re.compile(r'  async function enterGame\(\) \{.*?\n  \}\n\n  function logout', re.S)
          enter_replacement = dedent('''
            async function enterGame() {
              setPage("game");
              await refreshHelp();
              await refreshState();
              if (currentPlayer?.must_change_password) {
                showPasswordChangeUI();
                return;
              }
              showGameUI();
              startUnreadPolling();
            }

            function logout''').rstrip()
          app, count = enter_pattern.subn(enter_replacement, app, count=1)
          if count != 1:
              raise SystemExit('enterGame anchor not found')

          password_pattern = re.compile(r'  \$\("pwChangeForm"\)\?\.addEventListener\("submit", async \(e\) => \{.*?\n  \}\);', re.S)
          password_replacement = dedent('''
            $("pwChangeForm")?.addEventListener("submit", async (e) => {
              e.preventDefault();
              try {
                const data = await apiFetch("/api/change_password", {
                  method: "POST",
                  json: { old_password: $("oldPass").value, new_password: $("newPass").value },
                });
                if (data?.token) {
                  token = data.token;
                  localStorage.setItem(TOKEN_KEY, token);
                }
                $("oldPass").value = "";
                $("newPass").value = "";
                authMsg.textContent = "Password updated.";
                await enterGame();
              } catch (err) {
                authMsg.textContent = err.message || "Password change failed";
              }
            });''').rstrip()
          app, count = password_pattern.subn(password_replacement, app, count=1)
          if count != 1:
              raise SystemExit('password form anchor not found')

          app = replace_once(
              app,
              '      if (mode === "inbox") actions.appendChild(replyBtn);\n      actions.appendChild(delBtn);\n      actions.appendChild(reportBtn);',
              '      if (mode === "inbox") {\n        actions.appendChild(replyBtn);\n        actions.appendChild(reportBtn);\n      }\n      actions.appendChild(delBtn);',
              'message actions',
          )

          download_helper = dedent('''
            async function downloadAttachment(attachment) {
              const res = await fetch(`/api/messages/attachments/${encodeURIComponent(attachment.id)}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!res.ok) throw new Error(`Download failed (HTTP ${res.status})`);
              const blob = await res.blob();
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = attachment.filename || "attachment";
              document.body.appendChild(link);
              link.click();
              link.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

          ''')
          app = replace_once(app, '  function renderMessageList(container, messages, mode) {', download_helper + '  function renderMessageList(container, messages, mode) {', 'attachment helper')

          attachment_pattern = re.compile(r'      if \(Array\.isArray\(m\.attachments\).*?\n      \}\n\n      const actions', re.S)
          attachment_replacement = dedent('''
                if (Array.isArray(m.attachments) && m.attachments.length > 0) {
                  const label = document.createElement("span");
                  label.className = "muted";
                  label.textContent = "Attachments: ";
                  att.appendChild(label);
                  for (const attachment of m.attachments) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "ghost";
                    button.textContent = attachment.filename || "attachment";
                    button.addEventListener("click", async () => {
                      try {
                        await downloadAttachment(attachment);
                      } catch (error) {
                        alert(error.message || "Download failed");
                      }
                    });
                    att.appendChild(button);
                  }
                }

                const actions''').rstrip()
          app, count = attachment_pattern.subn(attachment_replacement, app, count=1)
          if count != 1:
              raise SystemExit('attachment renderer anchor not found')
          app = replace_once(app, '      if (att.innerHTML) item.appendChild(att);', '      if (att.childNodes.length > 0) item.appendChild(att);', 'attachment append')

          write(app_path, app)

          index_path = 'web/static/index.html'
          index = read(index_path)
          index = replace_once(index, '<link rel="stylesheet" href="/static/style.css" />', '<link rel="stylesheet" href="/style.css?v=01.06.01" />', 'stylesheet path')
          index = replace_once(index, '<script src="/static/app.js"></script>', '<script src="/app.js?v=01.06.01"></script>', 'script path')
          index = replace_once(index, '<small>v<span id="ver"></span></small>', '<small>v<span id="ver">01.06.01</span> | <a href="/bug.html" target="_blank" rel="noopener">Report A Bug</a></small>', 'footer')
          write(index_path, index)

          bug_path = 'web/static/bug.html'
          bug = read(bug_path)
          bug = bug.replace('style.css?v=01.04.00', '/style.css?v=01.06.01')
          bug = bug.replace('v01.04.00', 'v01.06.01')
          bug = bug.replace('bug.js?v=01.04.00', '/bug.js?v=01.06.01')
          write(bug_path, bug)

          test = dedent('''
            package build

            import (
              "os"
              "path/filepath"
              "runtime"
              "strings"
              "testing"
            )

            func TestWebClientMatchesAPIContracts(t *testing.T) {
              _, thisFile, _, ok := runtime.Caller(0)
              if !ok { t.Fatal("runtime.Caller failed") }
              root := filepath.Clean(filepath.Join(filepath.Dir(thisFile), "..", "..", ".."))
              app, err := os.ReadFile(filepath.Join(root, "web", "static", "app.js"))
              if err != nil { t.Fatalf("read app.js: %v", err) }
              html, err := os.ReadFile(filepath.Join(root, "web", "static", "index.html"))
              if err != nil { t.Fatalf("read index.html: %v", err) }

              client := string(app)
              shell := string(html)
              required := []string{
                `const TOKEN_KEY = "sovereign_token"`,
                `l.message || ""`,
                `e.title || e.kind`,
                `e.description`,
                `action: "UPGRADE_CITADEL"`,
                `return { type: "CORP", action, quantity }`,
                `return commodity ? { type, commodity } : { type }`,
                `showPasswordChangeUI`,
                `downloadAttachment`,
              }
              for _, value := range required {
                if !strings.Contains(client, value) { t.Fatalf("app.js missing %q", value) }
              }
              forbidden := []string{`l.msg`, `/static/app.js`, `/static/style.css`}
              for _, value := range forbidden {
                if strings.Contains(client+shell, value) { t.Fatalf("legacy contract remains: %q", value) }
              }
              for _, value := range []string{`/app.js?v=01.06.01`, `/style.css?v=01.06.01`, `/bug.html`} {
                if !strings.Contains(shell, value) { t.Fatalf("index.html missing %q", value) }
              }
            }
          ''').lstrip()
          Path('server/internal/build/web_contract_test.go').write_text(test)
          PY

      - name: Validate browser and server contracts
        shell: bash
        run: |
          node --check web/static/app.js
          node --check web/static/bug.js
          cd server
          go test -count=1 ./internal/build ./internal/api

      - name: Commit validated web repairs
        shell: bash
        run: |
          git rm -f -- .github/workflows/repair-web-010601.yml
          git add -- web/static/app.js web/static/index.html web/static/bug.html server/internal/build/web_contract_test.go
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): repair browser API contracts' -m 'Correct command serialization, event and activity fields, forced password changes, authenticated attachment downloads, asset paths, and bug reporting navigation.'
          git push origin HEAD:release-01.06.01-fixes
