name: Patch Multipart SAST Annotation

on:
  push:
    branches: [release-01.06.01-fixes]
    paths:
      - .github/workflows/prepare-dev-release-010602.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: server/go.sum

      - name: Add targeted SAST justification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server/internal/api/server.go")
          content = path.read_text()
          old = "\tif err := r.ParseMultipartForm(maxMultipartMemory); err != nil {"
          new = "\tif err := r.ParseMultipartForm(maxMultipartMemory); err != nil { // #nosec G120 -- MaxBytesReader immediately above caps the complete request body."
          if content.count(old) != 1:
              raise SystemExit(f"expected one multipart parser call, found {content.count(old)}")
          path.write_text(content.replace(old, new, 1))
          PY

      - name: Validate annotated source
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/api/server.go
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Commit validated annotation
        shell: bash
        run: |
          set -euo pipefail
          git add -- server/internal/api/server.go
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security: document bounded multipart parsing'
          git push origin HEAD:release-01.06.01-fixes
