name: Prepare Development Release 01.06.02

on:
  push:
    branches:
      - release-01.06.01-fixes
    paths:
      - .github/workflows/prepare-dev-release-010602.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v5
        with:
          ref: release-01.06.01-fixes
          fetch-depth: 0

      - name: Set up patched Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: server/go.sum

      - name: Prepare version, workflows, and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          VERSION = "01.06.02"
          BRANCH = "release-01.06.01-fixes"

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)

          def replace_required(path: str, old: str, new: str) -> None:
              content = read(path)
              if old not in content:
                  raise SystemExit(f"{path}: required text not found: {old}")
              write(path, content.replace(old, new))

          write("VERSION", VERSION + "\n")
          replace_required("server/internal/config/config.go", 'Version = "01.06.01"', f'Version = "{VERSION}"')
          replace_required("Dockerfile", "golang:1.26.5-alpine3.24", "golang:1.26.6-alpine3.24")
          replace_required("server/Dockerfile", "golang:1.26.5-alpine3.24", "golang:1.26.6-alpine3.24")
          replace_required("server/internal/build/root_dockerfile_test.go", "golang:1.26.5-alpine3.24", "golang:1.26.6-alpine3.24")
          replace_required("web/static/index.html", "01.06.01", VERSION)
          replace_required("server/internal/build/web_contract_test.go", "01.06.01", VERSION)

          write("web/static/bug.html", dedent(f'''\
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Report A Bug - Sovereign Conquest</title>
            <link rel="stylesheet" href="/style.css?v={VERSION}">
          </head>
          <body>
            <div class="wrap">
              <header class="header">
                <div class="title">Report A Bug</div>
                <div class="subtitle" id="bugVersion">v{VERSION}</div>
              </header>
              <section class="panel">
                <div class="card">
                  <h3>Bug report</h3>
                  <div class="muted">This sends a message, with optional attachments, to the administrator account through in-game messaging.</div>
                  <form id="bugForm" class="bugForm">
                    <label>Title</label>
                    <input id="bugSubject" maxlength="120" required placeholder="Short summary">
                    <label>Description</label>
                    <textarea id="bugBody" rows="10" maxlength="8000" required placeholder="What happened? What did you expect? Steps to reproduce?"></textarea>
                    <label>Attachments (optional)</label>
                    <div class="muted">Up to 5 files, 5 MiB each, 25 MiB total.</div>
                    <input id="bugFiles" type="file" multiple>
                    <button type="submit">Send bug report</button>
                  </form>
                  <div id="bugMsg" class="msg"></div>
                  <div id="bugHint" class="muted"></div>
                </div>
              </section>
            </div>
            <script src="/bug.js?v={VERSION}"></script>
          </body>
          </html>
          '''))

          ci = dedent('''\
          name: CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, release-01.06.01-fixes]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: ci-__O__ github.workflow __C__-__O__ github.ref __C__
            cancel-in-progress: true

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
                  with:
                    persist-credentials: false

                - name: Set up Go
                  uses: actions/setup-go@v5
                  with:
                    go-version: 1.26.6
                    cache-dependency-path: server/go.sum

                - name: Verify JavaScript syntax
                  run: |
                    node --check web/static/app.js
                    node --check web/static/compat-010601.js
                    node --check web/static/bug.js

                - name: Verify Go formatting
                  working-directory: server
                  shell: bash
                  run: |
                    files="$(gofmt -l .)"
                    if [ -n "$files" ]; then
                      printf 'Go files require gofmt:\n%s\n' "$files" >&2
                      exit 1
                    fi

                - name: Verify module graph
                  working-directory: server
                  run: go mod verify

                - name: Run unit and regression tests
                  working-directory: server
                  run: go test -count=1 ./...

                - name: Run race tests
                  working-directory: server
                  run: go test -race -count=1 ./...

                - name: Run Go vet
                  working-directory: server
                  run: go vet ./...

                - name: Run Go vulnerability analysis
                  working-directory: server
                  shell: bash
                  run: |
                    go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
                    "$(go env GOPATH)/bin/govulncheck" ./...

                - name: Validate Compose configuration
                  shell: bash
                  run: |
                    cp .env.example .env
                    docker compose config --quiet
          ''')
          write(".github/workflows/ci.yml", ci)

          build_validation = dedent('''\
          name: Build Validation

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, release-01.06.01-fixes]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: build-__O__ github.workflow __C__-__O__ github.ref __C__
            cancel-in-progress: true

          jobs:
            containers:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
                  with:
                    persist-credentials: false

                - name: Build combined image
                  run: docker build --pull --tag sovereign-conquest:validation .

                - name: Build API image
                  run: docker build --pull --tag sovereign-conquest-api:validation ./server

                - name: Build web image
                  run: docker build --pull --tag sovereign-conquest-web:validation ./web
          ''')
          write(".github/workflows/build-validation.yml", build_validation)

          codeql = dedent('''\
          name: CodeQL

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main, release-01.06.01-fixes]
            workflow_dispatch:

          permissions:
            actions: read
            contents: read
            security-events: write

          concurrency:
            group: codeql-__O__ github.workflow __C__-__O__ github.ref __C__
            cancel-in-progress: true

          jobs:
            analyze:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v5
                  with:
                    persist-credentials: false

                - name: Initialize CodeQL
                  uses: github/codeql-action/init@v3
                  with:
                    languages: go
                    build-mode: manual

                - name: Set up Go
                  uses: actions/setup-go@v5
                  with:
                    go-version: 1.26.6
                    cache-dependency-path: server/go.sum

                - name: Build
                  working-directory: server
                  run: go build ./...

                - name: Analyze
                  uses: github/codeql-action/analyze@v3
          ''')
          write(".github/workflows/codeql.yml", codeql)

          dev_release = dedent('''\
          name: Publish Development Release

          on:
            push:
              branches: [release-01.06.01-fixes]
              paths:
                - releases/dev-*.json
            workflow_dispatch:

          permissions:
            contents: write
            packages: write
            attestations: write
            id-token: write

          concurrency:
            group: sovereign-conquest-development-release
            cancel-in-progress: false

          jobs:
            publish:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout candidate
                  uses: actions/checkout@v5
                  with:
                    fetch-depth: 0
                    persist-credentials: false

                - name: Set up Go
                  uses: actions/setup-go@v5
                  with:
                    go-version: 1.26.6
                    cache-dependency-path: server/go.sum

                - name: Read and validate release manifest
                  id: release
                  shell: bash
                  run: |
                    set -euo pipefail
                    manifest="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^releases/dev-[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.json$' | head -n 1 || true)"
                    if [ -z "$manifest" ]; then
                      manifest="$(find releases -maxdepth 1 -type f -name 'dev-*.json' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
                    fi
                    test -n "$manifest"
                    version="$(jq -er '.version' "$manifest")"
                    channel="$(jq -er '.channel' "$manifest")"
                    notes_file="$(jq -er '.notes_file' "$manifest")"
                    [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]
                    test "$channel" = "dev"
                    test -f "$notes_file"
                    test "$(tr -d '\r\n' < VERSION)" = "$version"
                    grep -q "Version = \"$version\"" server/internal/config/config.go
                    image="ghcr.io/${GITHUB_REPOSITORY,,}"
                    short_sha="${GITHUB_SHA:0:12}"
                    echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
                    echo "tag=dev-$version" >> "$GITHUB_OUTPUT"
                    echo "image=$image" >> "$GITHUB_OUTPUT"
                    echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

                - name: Validate source
                  working-directory: server
                  shell: bash
                  run: |
                    set -euo pipefail
                    go mod verify
                    go test -count=1 ./...
                    go test -race -count=1 ./...
                    go vet ./...
                    go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
                    "$(go env GOPATH)/bin/govulncheck" ./...

                - name: Verify browser syntax
                  run: |
                    node --check web/static/app.js
                    node --check web/static/compat-010601.js
                    node --check web/static/bug.js

                - name: Build local candidate image
                  run: docker build --pull --tag sovereign-conquest:dev-candidate .

                - name: Scan local candidate
                  uses: aquasecurity/trivy-action@0.35.0
                  with:
                    image-ref: sovereign-conquest:dev-candidate
                    format: table
                    exit-code: '1'
                    ignore-unfixed: true
                    vuln-type: os,library
                    severity: CRITICAL,HIGH

                - name: Generate SPDX SBOM
                  uses: aquasecurity/trivy-action@0.35.0
                  with:
                    image-ref: sovereign-conquest:dev-candidate
                    format: spdx-json
                    output: sovereign-conquest.spdx.json
                    exit-code: '0'

                - name: Smoke-test local candidate
                  shell: bash
                  env:
                    VERSION: __O__ steps.release.outputs.version __C__
                  run: |
                    set -euo pipefail
                    network="sc-local-$GITHUB_RUN_ID"
                    db="sc-local-db-$GITHUB_RUN_ID"
                    app="sc-local-app-$GITHUB_RUN_ID"
                    cleanup() {
                      docker rm -f "$app" "$db" >/dev/null 2>&1 || true
                      docker network rm "$network" >/dev/null 2>&1 || true
                    }
                    trap cleanup EXIT
                    docker network create "$network" >/dev/null
                    docker run -d --name "$db" --network "$network" \
                      -e POSTGRES_USER=sovereign \
                      -e POSTGRES_PASSWORD=DevelopmentOnlyDatabasePassword \
                      -e POSTGRES_DB=sovereign_conquest \
                      postgres:16-alpine >/dev/null
                    for attempt in $(seq 1 60); do
                      docker exec "$db" pg_isready -U sovereign -d sovereign_conquest >/dev/null 2>&1 && break
                      sleep 1
                    done
                    docker exec "$db" pg_isready -U sovereign -d sovereign_conquest >/dev/null
                    docker run -d --name "$app" --network "$network" -p 127.0.0.1:18080:8080 \
                      -e APP_ENV=development \
                      -e DATABASE_URL='postgres://sovereign:DevelopmentOnlyDatabasePassword@sc-local-db-'"$GITHUB_RUN_ID"':5432/sovereign_conquest?sslmode=disable' \
                      -e JWT_SECRET='Development-Only-JWT-Secret-For-Release-Validation-2026' \
                      -e ADMIN_SECRET='Development-Only-Administrator-Secret-For-Validation' \
                      -e INITIAL_ADMIN_USERNAME=admin \
                      -e INITIAL_ADMIN_PASSWORD='Development-Only-Admin-Password-2026!' \
                      -e UNIVERSE_SECTORS=40 \
                      -e PORT_TICK_SECONDS=0 \
                      -e PLANET_TICK_SECONDS=0 \
                      -e EVENT_TICK_SECONDS=0 \
                      -e PROTECTORATE_TICK_SECONDS=0 \
                      sovereign-conquest:dev-candidate >/dev/null
                    for attempt in $(seq 1 90); do
                      curl -fsS http://127.0.0.1:18080/api/readyz >/dev/null 2>&1 && break
                      sleep 1
                    done
                    curl -fsS http://127.0.0.1:18080/api/readyz >/dev/null || { docker logs "$app"; exit 1; }
                    curl -fsS http://127.0.0.1:18080/api/livez | jq -e --arg version "$VERSION" '.ok == true and .version == $version' >/dev/null
                    curl -fsS http://127.0.0.1:18080/api/version | jq -e --arg version "$VERSION" '.version == $version' >/dev/null
                    curl -fsS http://127.0.0.1:18080/ | grep -F "$VERSION" >/dev/null
                    admin_json="$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"Development-Only-Admin-Password-2026!"}' http://127.0.0.1:18080/api/login)"
                    echo "$admin_json" | jq -e '.state.must_change_password == true' >/dev/null
                    admin_token="$(echo "$admin_json" | jq -er '.token')"
                    curl -fsS -H "Authorization: Bearer $admin_token" -H 'Content-Type: application/json' \
                      -d '{"old_password":"Development-Only-Admin-Password-2026!","new_password":"Development-Only-Changed-Password-2026!"}' \
                      http://127.0.0.1:18080/api/change_password | jq -e '.ok == true' >/dev/null
                    player="smoke${GITHUB_RUN_ID: -6}"
                    registration="$(curl -fsS -H 'Content-Type: application/json' \
                      -d "{\"username\":\"$player\",\"password\":\"Development-Only-Player-Password-2026!\"}" \
                      http://127.0.0.1:18080/api/register)"
                    token="$(echo "$registration" | jq -er '.token')"
                    curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:18080/api/state | jq -e '.state != null' >/dev/null
                    curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
                      -d '{"type":"SCAN"}' http://127.0.0.1:18080/api/command >/dev/null

                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v3

                - name: Log in to GHCR
                  uses: docker/login-action@v3
                  with:
                    registry: ghcr.io
                    username: __O__ github.actor __C__
                    password: __O__ secrets.GITHUB_TOKEN __C__

                - name: Build and push development image
                  id: push
                  uses: docker/build-push-action@v6
                  with:
                    context: .
                    file: ./Dockerfile
                    push: true
                    platforms: linux/amd64
                    tags: |
                      __O__ steps.release.outputs.image __C__:dev
                      __O__ steps.release.outputs.image __C__:dev-__O__ steps.release.outputs.version __C__
                      __O__ steps.release.outputs.image __C__:sha-__O__ steps.release.outputs.short_sha __C__
                    labels: |
                      org.opencontainers.image.title=Sovereign Conquest
                      org.opencontainers.image.version=__O__ steps.release.outputs.version __C__
                      org.opencontainers.image.revision=__O__ github.sha __C__
                      org.opencontainers.image.source=__O__ github.server_url __C__/__O__ github.repository __C__
                    cache-from: type=gha,scope=dev-release
                    cache-to: type=gha,mode=max,scope=dev-release

                - name: Attest image provenance
                  uses: actions/attest-build-provenance@v3
                  with:
                    subject-name: __O__ steps.release.outputs.image __C__
                    subject-digest: __O__ steps.push.outputs.digest __C__
                    push-to-registry: true

                - name: Verify anonymous GHCR pull
                  shell: bash
                  env:
                    IMAGE: __O__ steps.release.outputs.image __C__
                    VERSION: __O__ steps.release.outputs.version __C__
                  run: |
                    set -euo pipefail
                    docker logout ghcr.io >/dev/null 2>&1 || true
                    docker image rm "$IMAGE:dev-$VERSION" "$IMAGE:dev" >/dev/null 2>&1 || true
                    clean_config="$(mktemp -d)"
                    trap 'rm -rf "$clean_config"' EXIT
                    DOCKER_CONFIG="$clean_config" docker pull "$IMAGE:dev-$VERSION"
                    docker image inspect "$IMAGE:dev-$VERSION" >/dev/null

                - name: Scan anonymously pulled image
                  uses: aquasecurity/trivy-action@0.35.0
                  with:
                    image-ref: __O__ steps.release.outputs.image __C__:dev-__O__ steps.release.outputs.version __C__
                    format: table
                    exit-code: '1'
                    ignore-unfixed: true
                    vuln-type: os,library
                    severity: CRITICAL,HIGH

                - name: Smoke-test anonymously pulled image
                  shell: bash
                  env:
                    IMAGE: __O__ steps.release.outputs.image __C__
                    VERSION: __O__ steps.release.outputs.version __C__
                  run: |
                    set -euo pipefail
                    network="sc-public-$GITHUB_RUN_ID"
                    db="sc-public-db-$GITHUB_RUN_ID"
                    app="sc-public-app-$GITHUB_RUN_ID"
                    cleanup() {
                      docker rm -f "$app" "$db" >/dev/null 2>&1 || true
                      docker network rm "$network" >/dev/null 2>&1 || true
                    }
                    trap cleanup EXIT
                    docker network create "$network" >/dev/null
                    docker run -d --name "$db" --network "$network" \
                      -e POSTGRES_USER=sovereign \
                      -e POSTGRES_PASSWORD=PublicPullValidationDatabasePassword \
                      -e POSTGRES_DB=sovereign_conquest \
                      postgres:16-alpine >/dev/null
                    for attempt in $(seq 1 60); do
                      docker exec "$db" pg_isready -U sovereign -d sovereign_conquest >/dev/null 2>&1 && break
                      sleep 1
                    done
                    docker exec "$db" pg_isready -U sovereign -d sovereign_conquest >/dev/null
                    docker run -d --name "$app" --network "$network" -p 127.0.0.1:18081:8080 \
                      -e APP_ENV=development \
                      -e DATABASE_URL='postgres://sovereign:PublicPullValidationDatabasePassword@sc-public-db-'"$GITHUB_RUN_ID"':5432/sovereign_conquest?sslmode=disable' \
                      -e JWT_SECRET='Public-Pull-Validation-JWT-Secret-For-Development-Release' \
                      -e INITIAL_ADMIN_PASSWORD='Public-Pull-Validation-Admin-Password-2026!' \
                      -e UNIVERSE_SECTORS=40 \
                      -e PORT_TICK_SECONDS=0 \
                      -e PLANET_TICK_SECONDS=0 \
                      -e EVENT_TICK_SECONDS=0 \
                      -e PROTECTORATE_TICK_SECONDS=0 \
                      "$IMAGE:dev-$VERSION" >/dev/null
                    for attempt in $(seq 1 90); do
                      curl -fsS http://127.0.0.1:18081/api/readyz >/dev/null 2>&1 && break
                      sleep 1
                    done
                    curl -fsS http://127.0.0.1:18081/api/readyz >/dev/null || { docker logs "$app"; exit 1; }
                    curl -fsS http://127.0.0.1:18081/api/version | jq -e --arg version "$VERSION" '.version == $version' >/dev/null
                    curl -fsS http://127.0.0.1:18081/ | grep -F "$VERSION" >/dev/null

                - name: Write release validation report
                  shell: bash
                  env:
                    VERSION: __O__ steps.release.outputs.version __C__
                    IMAGE: __O__ steps.release.outputs.image __C__
                    DIGEST: __O__ steps.push.outputs.digest __C__
                    TAG: __O__ steps.release.outputs.tag __C__
                  run: |
                    cat > dev-release-validation.md <<EOF
                    # Sovereign Conquest Development Release Validation

                    - Version: $VERSION
                    - Git tag: $TAG
                    - Source commit: $GITHUB_SHA
                    - Image: $IMAGE:dev-$VERSION
                    - Moving channel tag: $IMAGE:dev
                    - Image digest: $DIGEST
                    - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
                    - Unit and regression tests: passed
                    - Race detector: passed
                    - Go vet: passed
                    - govulncheck: zero reachable vulnerabilities
                    - Local container smoke test: passed
                    - Trivy high and critical scan: passed
                    - Anonymous GHCR pull: passed
                    - Publicly pulled container smoke test: passed
                    - Provenance attestation: published
                    EOF

                - name: Upload validation artifacts
                  uses: actions/upload-artifact@v4
                  with:
                    name: sovereign-conquest-dev-__O__ steps.release.outputs.version __C__
                    path: |
                      dev-release-validation.md
                      sovereign-conquest.spdx.json
                    if-no-files-found: error

                - name: Create or update GitHub prerelease
                  shell: bash
                  env:
                    GH_TOKEN: __O__ github.token __C__
                    VERSION: __O__ steps.release.outputs.version __C__
                    TAG: __O__ steps.release.outputs.tag __C__
                    NOTES_FILE: __O__ steps.release.outputs.notes_file __C__
                  run: |
                    set -euo pipefail
                    title="Sovereign Conquest $VERSION Development Release"
                    if gh release view "$TAG" >/dev/null 2>&1; then
                      gh release edit "$TAG" --target "$GITHUB_SHA" --title "$title" --notes-file "$NOTES_FILE" --prerelease
