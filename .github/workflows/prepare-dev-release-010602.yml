          ```

          ## Administrator season reset

          The endpoint is enabled only when `ADMIN_SECRET` is configured. It requires both an authenticated administrator bearer token and the separate `X-Admin-Secret` value.

          ```http
          POST /api/admin/soft_wipe
          Authorization: Bearer <administrator-token>
          X-Admin-Secret: <administration-secret>
          Content-Type: application/json

          {{"season_name":"Season X","reset_corps":false}}
          ```

