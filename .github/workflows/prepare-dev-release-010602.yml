name: Publish Development Release

on:
  push:
    branches: [release-01.06.01-fixes]
    paths:
      - releases/dev-*.json
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: sovereign-conquest-development-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache-dependency-path: server/go.sum

      - name: Read and validate release manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^releases/dev-[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.json$' | head -n 1 || true)"
          if [ -z "$manifest" ]; then
            manifest="$(find releases -maxdepth 1 -type f -name 'dev-*.json' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi
          test -n "$manifest"
          version="$(jq -er '.version' "$manifest")"
          channel="$(jq -er '.channel' "$manifest")"
          notes_file="$(jq -er '.notes_file' "$manifest")"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]
          test "$channel" = "dev"
          test -f "$notes_file"
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          grep -q "Version = \"$version\"" server/internal/config/config.go
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          echo "tag=dev-$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for branch validation gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wait_for_workflow() {
            workflow="$1"
            for attempt in $(seq 1 120); do
              record="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --commit "$GITHUB_SHA" \
                --workflow "$workflow" \
                --limit 20 \
                --json status,conclusion,headSha,url \
                --jq '[.[] | select(.headSha == env.GITHUB_SHA)][0] // empty')"
              if [ -z "$record" ]; then
                sleep 5
                continue
              fi
              status="$(jq -r '.status' <<<"$record")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$record")"
              url="$(jq -r '.url' <<<"$record")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "$workflow failed: $url" >&2
                  exit 1
                fi
                echo "$workflow passed: $url"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for $workflow on $GITHUB_SHA" >&2
            exit 1
          }
          wait_for_workflow CI
          wait_for_workflow "Build Validation"

      - name: Validate source and dependencies
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
          go mod verify
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          "$(go env GOPATH)/bin/gosec" -quiet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Verify browser and smoke-script syntax
        shell: bash
        run: |
          node --check web/static/app.js
          node --check web/static/compat-010601.js
          node --check web/static/bug.js
          bash -n scripts/release-smoke.sh

      - name: Build local candidate image
        run: docker build --pull --tag sovereign-conquest:dev-candidate .

      - name: Scan local candidate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sovereign-conquest:dev-candidate
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: sovereign-conquest:dev-candidate
          format: spdx-json
          output: sovereign-conquest.spdx.json
          exit-code: '0'

      - name: Smoke-test local candidate
        shell: bash
        env:
          SC_IMAGE: sovereign-conquest:dev-candidate
          SC_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          SC_HOST_PORT: '18080'
          SC_NAME_PREFIX: local
          SC_DB_PASSWORD: DevelopmentOnlyDatabasePassword
          SC_JWT_SECRET: Development-Only-JWT-Secret-For-Release-Validation-2026
          SC_ADMIN_SECRET: Development-Only-Administrator-Secret-For-Validation
          SC_INITIAL_ADMIN_PASSWORD: Development-Only-Admin-Password-2026!
        run: bash scripts/release-smoke.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push development image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.release.outputs.image }}:dev
            ${{ steps.release.outputs.image }}:dev-${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Sovereign Conquest
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=dev-release
          cache-to: type=gha,mode=max,scope=dev-release

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify anonymous GHCR pull
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$IMAGE:dev-$VERSION" "$IMAGE:dev" >/dev/null 2>&1 || true
          clean_config="$(mktemp -d)"
          trap 'rm -rf "$clean_config"' EXIT
          DOCKER_CONFIG="$clean_config" docker pull "$IMAGE:dev-$VERSION"
          docker image inspect "$IMAGE:dev-$VERSION" >/dev/null

      - name: Scan anonymously pulled image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.release.outputs.image }}:dev-${{ steps.release.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Smoke-test anonymously pulled image
        shell: bash
        env:
          SC_IMAGE: ${{ steps.release.outputs.image }}:dev-${{ steps.release.outputs.version }}
          SC_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          SC_HOST_PORT: '18081'
          SC_NAME_PREFIX: public
          SC_DB_PASSWORD: PublicPullValidationDatabasePassword
          SC_JWT_SECRET: Public-Pull-Validation-JWT-Secret-For-Development-Release
          SC_INITIAL_ADMIN_PASSWORD: Public-Pull-Validation-Admin-Password-2026!
        run: bash scripts/release-smoke.sh

      - name: Write release validation report
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > dev-release-validation.md <<EOF
          # Sovereign Conquest Development Release Validation

          - Version: $VERSION
          - Git tag: $TAG
          - Source commit: $GITHUB_SHA
          - Image: $IMAGE:dev-$VERSION
          - Moving channel tag: $IMAGE:dev
          - Image digest: $DIGEST
          - Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Unit and regression tests: passed
          - Race detector: passed
          - Go vet: passed
          - gosec static analysis: passed with targeted source annotations
          - govulncheck: zero reachable vulnerabilities
          - CodeQL: passed through the required Build Validation gate
          - Local container smoke test: passed
          - Trivy high and critical scan: passed
          - Anonymous GHCR pull: passed
          - Publicly pulled container smoke test: passed
          - Provenance attestation: published
          EOF

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-conquest-dev-${{ steps.release.outputs.version }}
          path: |
            dev-release-validation.md
            sovereign-conquest.spdx.json
          if-no-files-found: error

      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          set -euo pipefail
          title="Sovereign Conquest $VERSION Development Release"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$NOTES_FILE" --prerelease
            gh release upload "$TAG" dev-release-validation.md sovereign-conquest.spdx.json --clobber
          else
            gh release create "$TAG" dev-release-validation.md sovereign-conquest.spdx.json \
              --target "$GITHUB_SHA" --title "$title" --notes-file "$NOTES_FILE" --prerelease
          fi
          gh release view "$TAG" --json isPrerelease,tagName,targetCommitish,url
