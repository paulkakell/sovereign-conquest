          write(".env.example", env_example)

          readme = dedent(f'''\
          # Sovereign Conquest

          Sovereign Conquest is a turn-based browser game built around an authoritative Go command engine, PostgreSQL state, and a single-page web client. The current development candidate is **{VERSION}**.

          ## Development release

          The pre-merge development channel publishes the combined API and web image without changing `main` or the stable image tags.

          ```bash
          docker pull ghcr.io/paulkakell/sovereign-conquest:dev-{VERSION}
          ```

          The moving development channel is:

          ```bash
          docker pull ghcr.io/paulkakell/sovereign-conquest:dev
          ```

          Development images are validated with unit tests, regression tests, the race detector, `go vet`, `govulncheck`, container vulnerability scanning, an SPDX SBOM, a local runtime smoke test, an anonymous GHCR pull, and a second smoke test of the publicly pulled image. They are not stable releases.

          ## Architecture

          - Go API and transactional command engine
          - PostgreSQL authoritative state
          - Nginx split web deployment or an all-in-one image served by Go
          - Server-managed turn, port, planet, event, and Protectorate jobs
          - Per-player discovery and market intelligence
          - Planets, corporations, mines, rankings, seasons, messaging, and scheduled events

          Every state-changing game action is validated on the server and applied through database transactions. Client-provided outcomes are never authoritative.

          ## Local split deployment

          ```bash
          cp .env.example .env
          # Replace every placeholder secret in .env.
          docker compose up --build
          ```

          Open `http://localhost:3000`. The API is bound to `127.0.0.1:8080`. PostgreSQL is available only on the internal Compose network.

          To reset a development universe:

          ```bash
          docker compose down -v
          docker compose up --build
          ```

          ## All-in-one image

          ```bash
          docker build -t sovereign-conquest:{VERSION} .
          ```

          The combined image serves the API and web UI on port 8080. It requires PostgreSQL and runtime configuration. Production mode rejects weak secrets and database connections without transport verification.

          ## Required configuration

          - `DATABASE_URL`
          - `JWT_SECRET`
          - `INITIAL_ADMIN_PASSWORD`

          Optional administration and game settings are documented in `.env.example` and `docs/DEV_DEPLOYMENT_01.06.02.md`.

          ## Health and observability

          - `GET /api/livez`: process liveness and version
          - `GET /api/readyz`: database readiness
          - structured HTTP request logs include method, path, status, response size, duration, and client address

          ## Core commands

          ```text
          SCAN
          MOVE <sector>
          TRADE <BUY|SELL> <ORE|ORGANICS|EQUIPMENT> <quantity>
          PLANET INFO
          PLANET COLONIZE [name]
          PLANET LOAD <commodity> <quantity>
