name: Publish GHCR Image

on:
  schedule:
    - cron: '40 1 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA:0:12}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.release.outputs.image }}:main
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Sovereign Conquest
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ghcr-release
          cache-to: type=gha,mode=max,scope=ghcr-release

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Pull published version image
        run: docker pull "${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}"

      - name: Scan published image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Smoke-test published image
        shell: bash
        env:
          SC_IMAGE: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          SC_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          SC_HOST_PORT: '18083'
          SC_NAME_PREFIX: published
          SC_DB_PASSWORD: PublishedImageValidationDatabasePassword
          SC_JWT_SECRET: Published-Image-Validation-JWT-Secret-2026
          SC_ADMIN_SECRET: Published-Image-Validation-Administrator-Secret
          SC_INITIAL_ADMIN_PASSWORD: Published-Image-Validation-Admin-Password-2026!
        run: bash scripts/release-smoke.sh
