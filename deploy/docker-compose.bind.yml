# Deployment configuration 01.06.09. Use as a standalone Compose file.
# The database scripts also work with the published 01.06.06 API image.
name: conquest
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["bash", "/opt/sc-db/entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - /dockershare/containers/conquest/db:/var/lib/postgresql/data
      - type: bind
        source: /dockershare/containers/conquest/config/db
        target: /opt/sc-db
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "bash", "/opt/sc-db/check.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    networks:
      - net_internal

  api:
    image: "${SC_IMAGE:-ghcr.io/paulkakell/sovereign-conquest:01.06.09}"
    pull_policy: "${SC_PULL_POLICY:-always}"
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      DATABASE_URL: postgres://db:5432/?sslmode=disable
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      UNIVERSE_SEED: ${UNIVERSE_SEED:-2002}
      UNIVERSE_SECTORS: ${UNIVERSE_SECTORS:-200}
      TURN_REGEN_SECONDS: ${TURN_REGEN_SECONDS:-120}
      PORT_TICK_SECONDS: ${PORT_TICK_SECONDS:-60}
      PLANET_TICK_SECONDS: ${PLANET_TICK_SECONDS:-60}
      EVENT_TICK_SECONDS: ${EVENT_TICK_SECONDS:-60}
      PROTECTORATE_TICK_SECONDS: ${PROTECTORATE_TICK_SECONDS:-60}
      HTTP_ADDR: ":8080"
      WEB_ROOT: "/app/web"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - net_internal
      - net_external

networks:
  net_external:
    external: true
    name: containers-external
  net_internal:
    external: false
    name: conquest-internal
