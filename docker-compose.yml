services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: ./server
      network: ${SC_BUILD_NETWORK:-default}
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org|direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        GOPRIVATE: ${GOPRIVATE:-}
        GONOSUMDB: ${GONOSUMDB:-}
        SC_BUILD_DNS: ${SC_BUILD_DNS:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        SC_USE_VENDOR: ${SC_USE_VENDOR:-1}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRUST_PROXY_HEADERS: "true"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      UNIVERSE_SEED: ${UNIVERSE_SEED:-2002}
      UNIVERSE_SECTORS: ${UNIVERSE_SECTORS:-200}
      TURN_REGEN_SECONDS: ${TURN_REGEN_SECONDS:-120}
      PORT_TICK_SECONDS: ${PORT_TICK_SECONDS:-60}
      PLANET_TICK_SECONDS: ${PLANET_TICK_SECONDS:-60}
      EVENT_TICK_SECONDS: ${EVENT_TICK_SECONDS:-60}
      PROTECTORATE_TICK_SECONDS: ${PROTECTORATE_TICK_SECONDS:-60}
      HTTP_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:

volumes:
  db_data:
