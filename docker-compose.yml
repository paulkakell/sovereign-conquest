services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    image: "${SC_IMAGE:-ghcr.io/paulkakell/sovereign-conquest:main}"
    pull_policy: "${SC_PULL_POLICY:-always}"
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      TRUST_PROXY_HEADERS: "false"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      UNIVERSE_SEED: ${UNIVERSE_SEED:-2002}
      UNIVERSE_SECTORS: ${UNIVERSE_SECTORS:-200}
      TURN_REGEN_SECONDS: ${TURN_REGEN_SECONDS:-120}
      PORT_TICK_SECONDS: ${PORT_TICK_SECONDS:-60}
      PLANET_TICK_SECONDS: ${PLANET_TICK_SECONDS:-60}
      EVENT_TICK_SECONDS: ${EVENT_TICK_SECONDS:-60}
      PROTECTORATE_TICK_SECONDS: ${PROTECTORATE_TICK_SECONDS:-60}
      HTTP_ADDR: ":8080"
      WEB_ROOT: "/app/web"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
      - "127.0.0.1:${API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

networks:
  backend:

volumes:
  db_data:
